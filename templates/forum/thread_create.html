{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <a href="{% url 'forum_home' %}" class="btn btn-secondary btn-sm mb-3">← Назад до тем</a>

    <div class="card shadow-sm border-primary">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Створення нового обговорення</h4>
        </div>
        <div class="card-body">
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_title" class="form-label font-weight-bold">Назва теми:</label>
                    <input type="text" name="title" id="id_title" class="form-control" placeholder="Введіть коротку та зрозумілу назву..." required>
                </div>

                <div class="mb-3">
                    <label for="id_description" class="form-label font-weight-bold">Опис теми:</label>
                    <textarea name="description" id="id_description" rows="5" class="form-control" placeholder="Опишіть суть вашого обговорення..." required></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Опублікувати тему</button>
                    <a href="{% url 'forum_home' %}" class="btn btn-outline-secondary">Скасувати</a>
                </div>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}
