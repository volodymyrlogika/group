{% extends 'base.html' %}

{% block title %}Видалення проєкту: {{ object.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-12 col-md-8 col-lg-6">
    
    <div class="card shadow-sm border-0 rounded-3 text-center">
      <div class="card-body p-4 p-sm-5">
        
        <div class="text-danger mb-3">
          <i class="bi bi-exclamation-triangle-fill fs-1"></i>
        </div>

        <h3 class="card-title fw-bold mb-3">Видалення проєкту</h3>
        <p class="text-secondary mb-4">
          Ви дійсно бажаєте видалити проєкт <strong>"{{ object.name }}"</strong>?<br>
          Цю дію неможливо буде скасувати.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'project_detail' object.pk %}" class="btn btn-outline-secondary px-4">
              Скасувати
            </a>
            <button type="submit" class="btn btn-danger px-4 fw-semibold">
              <i class="bi bi-trash me-1"></i> Видалити
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>
</div>
{% endblock %}
